name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * 1"   # 每周一 UTC 03:17 = 北京时间 11:17
  workflow_dispatch:       # 也可手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync branches and tags from upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mmparko/dsh-purge.git

          # --tags --force：本地标签强制与上游对齐，避免 "would clobber existing tag"
          git fetch upstream --prune --tags --force
          git checkout master

          # sync upstream branches (master is merged to keep local commits)
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/upstream | sed 's#^upstream/##'); do
            if [ "$b" = "master" ]; then
              git merge upstream/master --no-edit || echo "merge master skipped"
            elif echo "$b" | grep -q '^archive/'; then
              echo "skip $b (PR archive branch; same commits available via archive tags)"
            elif git ls-tree -r --name-only "upstream/$b" | grep -q '^.github/workflows/'; then
              echo "skip $b (contains workflow files)"
            else
              git push origin "upstream/$b:$b" --force-with-lease || echo "push $b skipped"
            fi
          done
          git push origin master --force-with-lease || echo "push master skipped"

          # 标签与上游强制对齐，彻底消除 would clobber existing tag
          git push origin --tags --force || echo "push tags skipped"
          echo "branch sync finished"
